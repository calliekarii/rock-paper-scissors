<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div><b>Let's play Rock Paper Scissors vs. the computer - first to 5 points wins!</b></div>
    <br>
    <div>Your choice: 
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
    </div>
    <br>
    <div id="result"><b>Results</b></div>
    <br>
    <div id="score"><b>Score</b><br>
    Human: <span id="humanScoreEl">0</span><br>
    Computer: <span id="computerScoreEl">0</span></div>
    <br>
    <div id="winner"></div>

    <script src="rock-paper-scissors.js"></script>
</body>
</html>
